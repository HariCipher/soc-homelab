# Suricata threshold/suppress rules for this lab.
#
# Read by suricata as /etc/suricata/threshold.conf. Source of truth is this
# file, in git; scripts/phase4-trim.sh installs it.
#
# Every entry here must cite the baseline measurement that justifies it.
# "It seemed noisy" is not a reason - count it first.

# 2210054 SURICATA STREAM excessive retransmissions
# Baseline 2026-09-08 -> 2026-09-11: 5 alerts, all DC01 <-> Microsoft CDN
# over the NAT'd WAN uplink on port 80. Retransmissions on a slow uplink are
# a link-quality signal, not a detection. Suppressed for WAN-bound HTTP only
# - kept for lab-internal traffic, where excessive retransmissions could
# genuinely indicate a scan or a spoofed session.
suppress gen_id 1, sig_id 2210054, track by_src, ip 192.168.50.0/24
