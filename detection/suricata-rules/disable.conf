# ET Open categories switched off for this lab.
#
# Read by suricata-update as /etc/suricata/disable.conf. Source of truth is
# this file, in git; scripts/phase4-trim.sh installs it.
#
# Why trim at all: the full 52,596-rule set costs ~976 MiB of RSS on a host
# with 15 G total, 4 G of swap already full, and a Wazuh indexer that needs
# 1 G of its own. Rules that cannot fire on this network are pure RAM.
#
# The test for removal is "no host in the lab speaks this protocol", NOT
# "this seems unlikely". Anything an AD network could plausibly see is kept,
# including categories with no current traffic (tor, coinminer, phishing),
# because Phase 5 detection engineering needs something to tune against.
#
# The lab: one Windows DC (DNS/Kerberos/LDAP/SMB/MSRPC/NetBIOS), pfSense, and
# an Arch host. No web apps, no mobile devices, no ICS, no VoIP.

# ~ the largest category in ET Open by a wide margin. CVEs for Joomla,
# WordPress, phpBB, and a decade of PHP apps. Nothing in this lab serves HTTP.
group:emerging-web_specific_apps.rules

# No Android or iOS devices exist on this network.
group:emerging-mobile_malware.rules

# No industrial control systems.
group:emerging-scada.rules

# No SIP or telephony.
group:emerging-voip.rules

# No game clients.
group:emerging-games.rules

# No IM clients.
group:emerging-chat.rules

# No P2P clients.
group:emerging-p2p.rules

# Content-policy matching, not threat detection. Wrong tool for a SOC lab.
group:emerging-inappropriate.rules

# IE-era browser plugin attacks. No browser runs inside the lab network.
group:emerging-activex.rules

# Services that are not running anywhere in the lab. If any of these is ever
# stood up, delete the matching line and re-run scripts/phase4-trim.sh.
group:emerging-telnet.rules
group:emerging-tftp.rules
group:emerging-snmp.rules
group:emerging-imap.rules
group:emerging-pop3.rules
group:emerging-ftp.rules

